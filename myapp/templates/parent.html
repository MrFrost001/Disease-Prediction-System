<!DOCTYPE html>
<html lang="en">
<head>
{% load static %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Disease Prediction System</title>
<meta name="description" content="An ML-powered Disease Prediction System. Select symptoms and get a prediction with saved history." />
<style>
  :root{
    --primary:#0a6ebd; --primary-dark:#074f87; --accent:#19a7a3;
    --bg:#f4f8fb; --card:#ffffff; --text:#1a2332; --muted:#5b6b7a;
    --border:#e1e8ef; --danger:#c0392b; --success:#1e8e5a;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:1.2rem 1.5rem;box-shadow:0 2px 8px rgba(0,0,0,.1)}
  header h1{margin:0;font-size:1.6rem}
  header p{margin:.3rem 0 0;opacity:.9;font-size:.9rem}
  nav{background:#fff;border-bottom:1px solid var(--border);padding:.6rem 1.5rem;display:flex;gap:.5rem;flex-wrap:wrap}
  nav a{background:none;border:none;padding:.6rem 1rem;font-size:.95rem;cursor:pointer;border-radius:6px;color:var(--text);font-weight:500;text-decoration:none;display:inline-block}
  nav a:hover{background:var(--bg)}
  nav a.active{background:var(--primary);color:#fff}
  main{max-width:1100px;margin:2rem auto;padding:0 1.5rem}
  .hero{background:linear-gradient(135deg,#e0f0fa,#d4f1ef);padding:3rem 2rem;border-radius:14px;text-align:center;margin-bottom:2rem}
  .hero h2{margin:0 0 .8rem;font-size:2rem;color:var(--primary-dark)}
  .hero p{margin:0;color:var(--muted);font-size:1.05rem;max-width:600px;margin:0 auto}
  .features{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.2rem;margin-top:2rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.5rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h3{margin:0 0 .5rem;color:var(--primary)}
  .card p{margin:0;color:var(--muted);font-size:.92rem}
  h2.section{color:var(--primary-dark);text-align:center;margin:0 0 .3rem}
  .subtitle{text-align:center;color:var(--muted);margin-bottom:1.5rem}
  form{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.8rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .search-wrap{position:relative;margin-bottom:1rem}
  input[type=text].search{width:100%;padding:.6rem 2.4rem .6rem .9rem;border-radius:8px;border:1px solid var(--border);font-size:.95rem;box-sizing:border-box}
  .search-clear{
    display:none;
    align-items:center;
    justify-content:center;
    position:absolute;
    right:.5rem;
    top:50%;
    transform:translateY(-50%);
    width:1.6rem;
    height:1.6rem;
    border:none;
    border-radius:50%;
    background:var(--border);
    color:var(--muted);
    font-size:1.1rem;
    line-height:1;
    cursor:pointer;
    padding:0;
  }
  .search-clear:hover{background:#c9d4de;color:var(--text)}
  .symptom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.4rem 1.2rem;max-height:420px;overflow-y:auto;padding:.8rem;border:1px solid var(--border);border-radius:8px;background:#fbfdff}
  .symptom-item{display:flex;align-items:center;gap:.4rem;padding:.15rem 0;font-size:.9rem}

  /* --- Buttons: rebuilt for clear visibility and consistent contrast --- */
  .btn{
    display:inline-block;
    padding:.7rem 1.6rem;
    border-radius:8px;
    border:2px solid var(--border);
    background:#fff;
    color:var(--text);
    font-size:.95rem;
    font-weight:600;
    cursor:pointer;
    text-decoration:none;
    transition:background .15s ease, border-color .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--bg);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}

  .btn-primary{
    background:var(--success);
    color:#ffffff;
    border-color:var(--success);
    box-shadow:0 2px 6px rgba(30,142,90,.35);
  }
  .btn-primary:hover{background:#176f47;border-color:#176f47}

  .btn-secondary{
    background:#eef2f6;
    border-color:#c9d4de;
    color:var(--text);
  }
  .btn-secondary:hover{background:#e2e9f0}

  .btn-outline{
    background:#fff;
    border-color:var(--primary);
    color:var(--primary);
  }
  .btn-outline:hover{background:#e8f2fb}

  .btn-danger{
    background:var(--danger);
    color:#fff;
    border-color:var(--danger);
  }
  .btn-danger:hover{background:#962d22;border-color:#962d22}

  .actions{margin-top:1.5rem;display:flex;justify-content:center;gap:.9rem;flex-wrap:wrap}
  /* --- end button styles --- */

  .result{margin-top:1.5rem;background:#e8f7f5;border:1px solid #bce5e1;border-radius:12px;padding:1.2rem;text-align:center}
  .result .lbl{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .result .val{font-size:1.6rem;font-weight:700;color:var(--danger);margin:.3rem 0}
  .result .note{font-size:.8rem;color:var(--muted)}
  .table-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:12px;margin-top:1rem}
  table{width:100%;border-collapse:collapse;font-size:.88rem}
  th,td{padding:.7rem .8rem;text-align:left;border-bottom:1px solid var(--border)}
  th{background:#f1f6fa;font-weight:600}
  .empty{text-align:center;padding:3rem;background:#fff;border:2px dashed var(--border);border-radius:12px;margin-top:1rem}
 .history-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:.5rem;
  margin-bottom:.5rem;
}

/* Fix white box around Clear History */
.history-head form{
  display:inline;
  background:transparent;
  border:none;
  border-radius:0;
  padding:0;
  box-shadow:none;
}
  footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--border);margin-top:3rem;background:#fff}
</style>
</head>
<body>
<header>
  <h1>🩺 Disease Prediction System</h1>
  <p>ML-powered symptom checker (132 symptoms, 41 conditions) — educational use only</p>
</header>
<nav>
  <a href="{% url 'index' %}" class="{% if request.resolver_match.url_name == 'index' %}active{% endif %}">Home</a>
  <a href="{% url 'prediction' %}" class="{% if request.resolver_match.url_name == 'prediction' %}active{% endif %}">Disease Prediction</a>
  <a href="{% url 'history' %}" class="{% if request.resolver_match.url_name == 'history' %}active{% endif %}">Medical History</a>
</nav>

<main>
  {% block main %}
  {% endblock main %}
</main>

<footer>
  © 2026 Disease Prediction System &nbsp;•&nbsp; Developed by: Utkarsh Maurya
</footer>
</body>
</html>
